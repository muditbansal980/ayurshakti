[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ip-sakti-data"
version = "0.1.0"
description = "Local, source-traceable corpus tools for IP-SAKTI Sahayak"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pymongo>=4.13,<5",
  "python-dotenv>=1.1,<2",
  "pypdf>=6,<7",
  "truststore>=0.10,<1",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=5,<6"]
test = ["httpx>=0.28,<1"]

[project.scripts]
sakti = "ip_sakti.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

